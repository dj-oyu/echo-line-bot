name: Approved conversation prompt comparison
on:
  push:
    branches: [feature/dialect-prompt-pilot-20261007]
    paths: [.github/workflows/conversation-prompt-eval.yml]
permissions:
  contents: read
concurrency:
  group: conversation-prompt-pilot
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.repository == 'dj-oyu/echo-line-bot' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/feature/dialect-prompt-pilot-20261007' &&
      github.event.before == 'ecc02d1ca0f9a72dbe1b8ebb09c4b812110e894b' &&
      github.event.created == false && github.event.deleted == false && github.event.forced == false &&
      github.event.head_commit.message == 'test: run approved 28-call conversation pilot 20261007-pr73-01'
    runs-on: ubuntu-latest
    environment: env
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install frozen production lock and run offline preflight
        run: |
          uv sync --frozen
          uv run --frozen --no-sync python -c 'import openai; assert openai.__version__ == "3.6.0"'
          uv run --frozen --no-sync python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Run exactly the approved 28-request comparison
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run --frozen --no-sync python scripts/run_conversation_prompt_eval.py
      - name: Save sanitized comparison data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conversation-prompt-${{ github.run_id }}
          path: conversation-eval-results/*.json
          if-no-files-found: warn
          retention-days: 7
