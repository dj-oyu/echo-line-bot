name: One approved SDK diagnostic
on:
  push:
    branches: [feature/dialect-prompt-pilot-20261007]
    paths: [.github/workflows/dialect-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: dialect-sdk-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: >-
      github.repository == 'dj-oyu/echo-line-bot' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/feature/dialect-prompt-pilot-20261007' &&
      github.event.before == 'e537ac21a2205d810e5fd29860c1a885e28ff1a2' &&
      github.event.created == false && github.event.deleted == false && github.event.forced == false &&
      github.event.head_commit.message == 'test: run one approved SDK diagnostic 20261007-pr73-01'
    runs-on: ubuntu-latest
    environment: env
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install exact production lock
        run: uv sync --frozen
      - name: Verify locked SDK and offline request-count tests
        run: |
          uv run --frozen --no-sync python -c 'import openai; assert openai.__version__ == "3.6.0"'
          uv run --frozen --no-sync python -m unittest discover -s scripts/tests -p 'test_dialect_*.py' -v
      - name: Make exactly one diagnostic request
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run --frozen --no-sync python scripts/dialect_diagnostic.py
      - name: Save sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dialect-diagnostic-${{ github.run_id }}
          path: dialect-diagnostic-results/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
