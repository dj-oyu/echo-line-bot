name: Kansai dialect prompt pilot

on:
  workflow_dispatch:
  push:
    branches: [feature/dialect-prompt-pilot-20261007]
    paths: [.github/workflows/dialect-ab.yml]

permissions:
  contents: read

concurrency:
  group: dialect-ab-manual-pilot
  cancel-in-progress: false

jobs:
  compare:
    if: >-
      github.repository == 'dj-oyu/echo-line-bot' && github.run_attempt == 1 &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/feature/dialect-prompt-pilot-20261007' &&
        github.event.before == 'd56fddd573ba4f0c772d5c2413341e4800f1eab1' &&
        github.event.created == false && github.event.deleted == false && github.event.forced == false &&
        github.event.head_commit.message == 'test: run approved 40-call SDK pilot 20261007-pr73-02'))
    runs-on: ubuntu-latest
    environment: env
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Set up locked package runtime
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install exact production lock and verify SDK
        run: |
          uv sync --frozen
          uv run --frozen --no-sync python -c 'import openai; assert openai.__version__ == "3.6.0"'
          uv run --frozen --no-sync python -m unittest discover -s scripts/tests -p 'test_dialect_*.py' -v
      - name: Run 40 bounded Groq requests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run --frozen --no-sync python scripts/dialect_ab.py --execute
      - name: Save synthetic evaluation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dialect-ab-${{ github.run_id }}
          path: dialect-ab-results/*.json
          if-no-files-found: error
          retention-days: 7
