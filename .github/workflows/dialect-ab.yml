name: Kansai dialect prompt pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dialect-ab-manual-pilot
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'dj-oyu/echo-line-bot' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: env
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Run isolated offline tests
        run: python -m unittest discover -s scripts/tests -p 'test_dialect_ab.py' -v
      - name: Run 40 bounded Groq requests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/dialect_ab.py --execute
      - name: Save synthetic evaluation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dialect-ab-${{ github.run_id }}
          path: dialect-ab-results/*.json
          if-no-files-found: error
          retention-days: 7
