name: Deploy LINE AI Chatbot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: env
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        # Version comes from cdk/package.json's packageManager field
        package_json_file: cdk/package.json
        
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: cdk/pnpm-lock.yaml
        
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        
    - name: Install Python dependencies
      run: |
        uv sync
        
    - name: Build Lambda Layer
      run: |
        ./scripts/build-layer.sh
        
    - name: Run Python tests
      # Handler modules read these at import time; the values are never used
      # because every test that touches AWS mocks the client.
      env:
        CHANNEL_SECRET_NAME: test-channel-secret
        CHANNEL_ACCESS_TOKEN_NAME: test-channel-access-token
        CONVERSATION_TABLE_NAME: test-conversations
        SAMBA_NOVA_API_KEY_NAME: test-samba-key
        GROQ_API_KEY_NAME: test-groq-key
        XAI_API_KEY_SECRET_NAME: test-xai-key
        STEP_FUNCTION_ARN: arn:aws:states:ap-northeast-1:000000000000:stateMachine:test
        AWS_DEFAULT_REGION: ap-northeast-1
        # Dummy credentials so boto3 never walks its real provider chain while
        # building the module-level clients. Every AWS call in the tests is mocked.
        AWS_ACCESS_KEY_ID: testing
        AWS_SECRET_ACCESS_KEY: testing
        AWS_SESSION_TOKEN: testing
      run: |
        uv run pytest lambda/tests -v
        
    - name: Install CDK dependencies
      run: |
        cd cdk
        pnpm install
        
    - name: Build CDK
      run: |
        cd cdk
        pnpm run build
        
    - name: Run CDK tests
      run: |
        cd cdk
        pnpm test
        
    - name: CDK Synthesize
      env:
        SAMBANOVA_MODEL: ${{ vars.SAMBANOVA_MODEL }}
        GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT }}
        XAI_MODEL: ${{ vars.XAI_MODEL }}
      run: |
        cd cdk
        pnpm run cdk synth

  deploy:
    runs-on: ubuntu-latest
    environment: env
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        # Version comes from cdk/package.json's packageManager field
        package_json_file: cdk/package.json
        
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: cdk/pnpm-lock.yaml
        
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        
    - name: Install Python dependencies
      run: |
        uv sync
        
    - name: Build Lambda Layer
      run: |
        ./scripts/build-layer.sh
        
    - name: Install CDK dependencies
      run: |
        cd cdk
        pnpm install
        
    - name: Build CDK
      run: |
        cd cdk
        pnpm run build
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-1

    - name: Update or Create Secrets
      run: |
        aws secretsmanager update-secret --secret-id LINE_CHANNEL_SECRET --secret-string '${{ secrets.CHANNEL_SECRET }}' || 
        aws secretsmanager create-secret --name LINE_CHANNEL_SECRET --secret-string '${{ secrets.CHANNEL_SECRET }}'
        aws secretsmanager update-secret --secret-id LINE_CHANNEL_ACCESS_TOKEN --secret-string '${{ secrets.CHANNEL_ACCESS_TOKEN }}' || 
        aws secretsmanager create-secret --name LINE_CHANNEL_ACCESS_TOKEN --secret-string '${{ secrets.CHANNEL_ACCESS_TOKEN }}'
        aws secretsmanager update-secret --secret-id SAMBA_NOVA_API_KEY --secret-string '${{ secrets.SAMBA_NOVA_API_KEY }}' ||
        aws secretsmanager create-secret --name SAMBA_NOVA_API_KEY --secret-string '${{ secrets.SAMBA_NOVA_API_KEY }}'
        aws secretsmanager update-secret --secret-id GROQ_API_KEY --secret-string '${{ secrets.GROQ_API_KEY }}' ||
        aws secretsmanager create-secret --name GROQ_API_KEY --secret-string '${{ secrets.GROQ_API_KEY }}'
        aws secretsmanager update-secret --secret-id XAI_API_KEY --secret-string '{"XAI_API_KEY":"${{ secrets.XAI_API_KEY }}"}' ||
        aws secretsmanager create-secret --name XAI_API_KEY --secret-string '{"XAI_API_KEY":"${{ secrets.XAI_API_KEY }}"}'
        
    - name: Deploy to AWS
      env:
        SAMBANOVA_MODEL: ${{ vars.SAMBANOVA_MODEL }}
        GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT }}
        XAI_MODEL: ${{ vars.XAI_MODEL }}
      run: |
        cd cdk
        pnpm run cdk deploy --require-approval never --ci
        
    - name: Notify deployment success
      if: success()
      run: |
        echo "🚀 Deployment successful!"
        echo "API Gateway URL: $(aws cloudformation describe-stacks --stack-name LineEchoStack --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayUrl`].OutputValue' --output text)"
        
    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        exit 1
